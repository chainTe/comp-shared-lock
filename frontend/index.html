<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COMP Shared Lock</title>
    <style>
      body { font-family: monospace; max-width: 860px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #ddd; }
      h1 { color: #7f6; }
      .card { border: 1px solid #333; border-radius: 8px; padding: 1rem; margin: 1rem 0; background: #1a1a1a; }
      label { display: block; margin: 0.5rem 0 0.2rem; color: #999; font-size: 0.85rem; }
      input, textarea { width: 100%; box-sizing: border-box; background: #000; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 0.5rem; font-family: monospace; }
      button { background: #7f6; color: #000; border: 0; border-radius: 4px; padding: 0.6rem 1.2rem; margin-top: 0.8rem; cursor: pointer; font-weight: bold; }
      button:disabled { background: #555; cursor: not-allowed; }
      .row { display: flex; gap: 1rem; flex-wrap: wrap; }
      .col { flex: 1; min-width: 300px; }
      pre { background: #000; padding: 0.8rem; border-radius: 4px; overflow-x: auto; font-size: 0.8rem; }
      .ok { color: #7f6; } .err { color: #f66; }
      a { color: #6cf; }
    </style>
  </head>
  <body>
    <h1>COMP Shared Lock (CKB Testnet)</h1>
    <p>Anyone may use the Cell, but nobody may take the Cell.</p>

    <div class="card">
      <label>Fee payer private key (testnet only, pays tx fee)</label>
      <input id="feeKey" type="password" placeholder="0x..." />
      <div id="feeAddr"></div>
    </div>

    <div class="card">
      <h3>Shared Cell</h3>
      <button id="refresh">Refresh</button>
      <pre id="cellInfo">loading...</pre>
    </div>

    <div class="row">
      <div class="card col">
        <h3>Post Anonymous Message</h3>
        <label>payload</label>
        <textarea id="anonPayload" rows="3">hello comp</textarea>
        <button id="postAnon">Post (anonymous)</button>
      </div>

      <div class="card col">
        <h3>Post Signed Message</h3>
        <label>author private key (identity, can be any key)</label>
        <input id="authorKey" type="password" placeholder="0x... (leave empty to generate)" />
        <label>payload</label>
        <textarea id="signedPayload" rows="3">hello comp, signed</textarea>
        <button id="postSigned">Post (signed)</button>
      </div>

      <div class="card col">
        <h3>Sponsor</h3>
        <label>amount (CKB) to add to the shared cell</label>
        <input id="sponsorAmount" type="number" value="100" min="1" />
        <button id="sponsor">Sponsor</button>
      </div>
    </div>

    <div class="card">
      <h3>Log</h3>
      <pre id="log"></pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
